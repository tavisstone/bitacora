<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS3 - Centro de Monitoreo y Sistemas Privados</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)), url('wall.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: rgba(10, 18, 28, 0.85);
            border: 1px solid #1f3b5c;
            border-radius: 12px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 0 30px rgba(0, 100, 255, 0.25);
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .login-logo {
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #7b93a8;
            margin-bottom: 8px;
        }

        .login-title {
            font-size: 18px;
            letter-spacing: 1.5px;
            color: #00ffff;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: #7b93a8;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            background: #192533;
            border: 1px solid #1f3b5c;
            padding: 12px 15px;
            color: #00ffff;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        .btn-login {
            background: linear-gradient(to bottom, #004b7a, #001a33);
            border: 1px solid #005a9e;
            border-radius: 6px;
            padding: 12px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 110, 255, 0.4);
            transition: background 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: linear-gradient(to bottom, #005a9e, #002240);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .footer-status {
            margin-top: 25px;
            font-size: 10px;
            color: #00ffcc;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #00ffcc;
            border-radius: 50%;
            box-shadow: 0 0 6px #00ffcc;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-logo">Servicio Global de Seguridad GS3</div>
        <div class="login-title">Centro de Monitoreo</div>

        <form action="dashboard.html" method="GET">
            <div class="form-group">
                <label for="usuario">Usuario / Operador</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Acceder al Sistema</button>
        </form>

        <div class="footer-status">
            <span class="status-dot"></span> SISTEMA DE ACCESO SEGURO
        </div>
    </div>

</body>
</html>
