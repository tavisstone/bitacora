<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS3 - Bitácora de Custodias</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-section" class="login-container">
        <div class="logo-box">
            <img src="logo-gs3.png" alt="Logo GS3">
        </div>
        <div class="login-box">
            <h2>SERVICIO GLOBAL DE SEGURIDAD Y SISTEMAS PRIVADOS GS3 S.A. DE C.V.</h2>
            <div class="form-group">
                <input type="text" id="username" placeholder="USERNAME">
                <input type="password" id="password" placeholder="PASSWORD">
            </div>
            <button id="login-btn" onclick="iniciarSesion()">LOGIN</button>
        </div>
    </div>

    <div id="dashboard-section" class="dashboard-container" style="display: none;">
        <header>
            <h2>Bitácora Electrónica</h2>
            <button onclick="cerrarSesion()">Cerrar Sesión</button>
        </header>
        <div class="controls">
            <label class="btn-file">📁 Cargar Base de Datos
                <input type="file" id="excel-file" accept=".xlsx, .xls" onchange="cargarExcel(event)">
            </label>
            <button onclick="exportarExcel()" class="btn-success">💾 Descargar Respaldo</button>
        </div>
        <table id="viajes-table">
            <thead>
                <tr><th>ID Viaje</th><th>Cliente</th><th>Origen</th><th>Destino</th><th>Estatus</th><th>Acción</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
