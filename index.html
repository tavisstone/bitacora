<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS3 - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* ENCABEZADO: Tipografía elegante y corporativa con destello */
        .header-text {
            text-align: center;
            padding-top: 20px;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 3px;
            white-space: nowrap;
            text-transform: uppercase;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            
            background: linear-gradient(90deg, #bbbbbb 0%, #ffffff 50%, #bbbbbb 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 5s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* CONTENEDOR CENTRAL */
        .main-content {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 80px;
            flex-grow: 1;
        }

        /* LOGO CON ANIMACIÓN DE ONDA DE ENERGÍA */
        .logo-container {
            width: 450px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            width: 100%;
            display: block;
            -webkit-mask-image: radial-gradient(circle at center, black 45%, transparent 72%);
            mask-image: radial-gradient(circle at center, black 45%, transparent 72%);
            position: relative;
            z-index: 2;
        }

        /* Onda de energía alrededor del logo */
        .logo-container::after {
            content: '';
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            border: 2px dashed rgba(0, 191, 255, 0.4);
            box-shadow: 0 0 25px rgba(0, 150, 255, 0.3), inset 0 0 25px rgba(0, 150, 255, 0.3);
            animation: pulse-ring 4s infinite linear;
            z-index: 1;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.3; }
            50% { transform: scale(1.05); opacity: 0.8; box-shadow: 0 0 40px rgba(0, 220, 255, 0.7), inset 0 0 40px rgba(0, 220, 255, 0.7); }
            100% { transform: scale(0.95); opacity: 0.3; }
        }

        /* PANEL DE LOGIN */
        .login-panel {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Alineado a la izquierda del bloque interno */
            width: 380px;
        }

        /* IMAGEN SILUETA.PNG ALINEADA A LOS INPUTS SEGÚN TU LÍNEA AZUL */
        .silueta-container {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #1f3b5c;
            background: radial-gradient(circle, #0f1b29, #000);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(0, 150, 255, 0.4);
            overflow: hidden;
            /* Empujamos la silueta exactamente al eje de los inputs y botón (dejando espacio para la etiqueta "USERNAME") */
            margin-left: 110px; 
        }

        .silueta-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* CUADROS DE TEXTO Y ETIQUETAS */
        .input-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
        }

        .input-group label {
            color: #7b93a8;
            font-size: 12px;
            letter-spacing: 1px;
            text-align: left;
            width: 90px;
        }

        .input-group input {
            width: 260px;
            background: linear-gradient(to bottom, #192533, #0b1118);
            border: 1px solid #1f3b5c;
            border-radius: 4px;
            padding: 12px;
            color: #00ffff;
            outline: none;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.9), 0 0 8px rgba(0, 150, 255, 0.1);
        }

        /* BOTÓN LOGIN OVALADO CENTRADO CON LOS INPUTS */
        .login-btn {
            background: linear-gradient(to bottom, #004b7a, #001a33);
            border: 1px solid #005a9e;
            border-radius: 25px;
            padding: 10px 45px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 110, 255, 0.5);
            margin-top: 15px;
            width: 260px;
            align-self: flex-end; /* Alineado perfectamente al ancho de los inputs */
        }
        .login-btn:hover { background: linear-gradient(to bottom, #005a9e, #002240); }
        .login-btn span { color: #00ffff; font-size: 18px; font-weight: bold; }

        /* FOOTER */
        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding-bottom: 15px;
        }
        .logos-asociaciones { display: flex; gap: 10px; }
        .badge { background: #fff; color: #000; font-size: 10px; padding: 3px 6px; font-weight: bold; border-radius: 2px;}
        
        .redes { display: flex; gap: 12px; }
        .redes span {
            display: flex; justify-content: center; align-items: center;
            width: 32px; height: 32px; border-radius: 50%; color: white; background: #333; cursor: pointer; font-size: 14px;
        }
        .fb { background: #3b5998 !important; }
        .ig { background: #e1306c !important; }
        .tw { background: #1da1f2 !important; }
        .in { background: #0077b5 !important; }
        .web { background: #555 !important; }
    </style>
</head>
<body>

    <!-- ENCABEZADO ELEGANTE -->
    <div class="header-text">
        SERVICIO GLOBAL DE SEGURIDAD Y SISTEMAS PRIVADOS GS3 S.A. DE C.V.
    </div>

    <!-- CONTENEDOR CENTRAL -->
    <div class="main-content">
        <!-- LOGO CON ONDA DE ENERGÍA -->
        <div class="logo-container">
            <img src="logo-gs3.png" alt="Logo GS3">
        </div>

        <!-- LOGIN -->
        <div class="login-panel">
            <!-- SILUETA ALINEADA A LOS INPUTS -->
            <div class="silueta-container">
                <img src="silueta.png" alt="Silueta Usuario">
            </div>
            
            <div class="input-group">
                <label>USERNAME</label>
                <input type="text">
            </div>
            
            <div class="input-group">
                <label>PASSWORD</label>
                <input type="password">
            </div>
            
            <button class="login-btn">
                <span>✓</span> LOGIN
            </button>
        </div>
    </div>

    <!-- PIE DE PÁGINA -->
    <div class="footer">
        <div class="logos-asociaciones">
            <span class="badge">AMESP</span> 
            <span class="badge">ASIS</span> 
            <span class="badge">ALAS</span>
        </div>
        <div class="redes">
            <span class="fb">f</span> 
            <span class="ig">📷</span> 
            <span class="tw">🐦</span> 
            <span class="in">in</span> 
            <span class="web">🌐</span>
        </div>
    </div>

</body>
</html>
