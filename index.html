<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GS3 - Login</title>
    <!-- CORRECCIÓN: Enlace correcto para importar Montserrat desde Google Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            /* CAMBIO: Aplicada la tipografía Montserrat de forma global */
            font-family: 'Montserrat', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* LEYENDA SUPERIOR CON ESTILO DE SEGURIDAD Y DESTELLO */
        .header-text {
            text-align: center;
            padding-top: 20px;
            font-size: 25px;
            font-weight: 700;
            letter-spacing: 3px;
            white-space: nowrap;
            text-transform: uppercase;
            /* CAMBIO: Se usa Montserrat para unificar la identidad corporativa elegante */
            font-family: 'Montserrat', sans-serif; 
            
            /* Animación de destello brillante de izquierda a derecha */
            background: linear-gradient(90deg, #ffffff 0%, #00ffff 50%, #ffffff 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 4s linear infinite;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.4);
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        /* CONTENEDOR CENTRAL */
        .main-content {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 70px;
            flex-grow: 1;
        }

        /* LOGO CON DIFUMINADO */
        .logo-container {
            width: 450px;
            -webkit-mask-image: radial-gradient(circle at center, black 45%, transparent 72%);
            mask-image: radial-gradient(circle at center, black 45%, transparent 72%);
        }
        .logo-container img {
            width: 100%;
            display: block;
        }

        /* PANEL DE LOGIN */
        .login-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 420px;
        }

        /* CONTENEDOR DEL VECTOR DE USUARIO CON ESTILO IMPONENTE */
        .silueta-container {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 2px solid #1f3b5c;
            background: radial-gradient(circle, #0f1b29, #000);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(0, 150, 255, 0.4);
            overflow: hidden;
            /* CAMBIO: Color gris claro/blanco para el vector interno */
            color: #e0e6ed; 
        }

        /* Ajuste del tamaño del vector SVG */
        .silueta-container svg {
            width: 55%;
            height: 55%;
        }

        /* CUADROS DE TEXTO Y ETIQUETAS */
        .input-group {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            margin-bottom: 20px;
        }

        .input-group label {
            color: #7b93a8;
            font-size: 13px;
            letter-spacing: 1px;
            margin-right: 20px;
            text-align: right;
            font-weight: 700;
        }

        .input-group input {
            width: 260px;
            background: linear-gradient(to bottom, #192533, #0b1118);
            border: 1px solid #1f3b5c;
            border-radius: 4px;
            padding: 12px;
            color: #00ffff;
            outline: none;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.9), 0 0 8px rgba(0, 150, 255, 0.1);
            font-family: 'Montserrat', sans-serif;
        }

        /* BOTÓN LOGIN OVALADO */
        .login-btn {
            background: linear-gradient(to bottom, #004b7a, #001a33);
            border: 1px solid #005a9e;
            border-radius: 25px;
            padding: 10px 45px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 110, 255, 0.5);
            margin-top: 15px;
            margin-left: 100px;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
        }
        .login-btn:hover { background: linear-gradient(to bottom, #005a9e, #002240); }
        .login-btn span { color: #00ffff; font-size: 18px; font-weight: bold; }

        /* FOOTER */
        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding-bottom: 15px;
        }
        .logos-asociaciones { display: flex; gap: 10px; }
        .badge { background: #fff; color: #000; font-size: 10px; padding: 3px 6px; font-weight: bold; border-radius: 2px;}
        
        .redes { display: flex; gap: 12px; }
        .redes span {
            display: flex; justify-content: center; align-items: center;
            width: 32px; height: 32px; border-radius: 50%; color: white; background: #333; cursor: pointer; font-size: 14px;
        }
        .fb { background: #3b5998 !important; }
        .ig { background: #e1306c !important; }
        .tw { background: #1da1f2 !important; }
        .in { background: #0077b5 !important; }
        .web { background: #555 !important; }
    </style>
</head>
<body>

    <!-- LEYENDA SUPERIOR CON DESTELLO -->
    <div class="header-text">
        Servicio Global de Seguridad y Sistemas Privados GS3 S.A. DE C.V.
    </div>

    <!-- CONTENEDOR CENTRAL -->
    <div class="main-content">
        <!-- LOGO -->
        <div class="logo-container">
            <img src="logo-gs3.png" alt="Logo GS3">
        </div>

        <!-- LOGIN -->
        <div class="login-panel">
            <!-- ICONO VECTORIAL DE USUARIO -->
            <div class="silueta-container">
                <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            
            <div class="input-group">
                <label>USERNAME</label>
                <input type="text">
            </div>
            
            <div class="input-group">
                <label>PASSWORD</label>
                <input type="password">
            </div>
            
            <button class="login-btn">
                <span>✓</span> LOGIN
            </button>
        </div>
    </div>

    <!-- PIE DE PÁGINA -->
    <div class="footer">
        <div class="logos-asociaciones">
            <span class="badge">AMESP</span> 
            <span class="badge">ASIS</span> 
            <span class="badge">ALAS</span>
        </div>
        <div class="redes">
            <span class="fb">f</span> 
            <span class="ig">📷</span> 
            <span class="tw">🐦</span> 
            <span class="in">in</span> 
            <span class="web">🌐</span>
        </div>
    </div>

</body>
</html>
